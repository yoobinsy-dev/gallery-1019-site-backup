<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10.19 갤러리&라운지 - 작품 관리</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/tabulator-6.5.0/tabulator.min.css">
  <link rel="stylesheet" href="artwork-management.css">
</head>
<body class="artwork-management-page">
  <main class="page-container artwork-page">
    <header class="page-header artwork-header">
      <button class="back-btn" type="button" onclick="location.href='gallery-lounge.html'">← 돌아가기</button>
      <h1>작품 관리</h1>
      <div class="header-spacer"></div>
    </header>

    <section class="artwork-workspace" aria-label="작품 관리 도구">
      <div class="artwork-tabs" role="tablist">
        <button class="artwork-tab active" type="button" role="tab" data-tab="collection" aria-selected="true">소장품</button>
        <button class="artwork-tab" type="button" role="tab" data-tab="past" aria-selected="false">과거 전시 작품</button>
      </div>
      <div class="artwork-toolbar">
        <label class="artwork-search"><span>검색</span><input id="artwork-search" type="search" placeholder="작품명, 작가, 재료, 전시명"></label>
        <div class="artwork-actions">
          <span id="artwork-selection-count" aria-live="polite">0개 선택</span>
          <button id="artwork-add-btn" class="works-action-btn" type="button">+ 행 추가</button>
          <button id="artwork-add-existing-btn" class="works-action-btn" type="button">기존 작품에서 추가</button>
          <button id="artwork-exhibition-btn" class="works-action-btn" type="button" hidden>전시에서 작품 추가</button>
          <button id="artwork-export-btn" class="works-action-btn works-action-btn-secondary" type="button">Excel 다운로드</button>
          <button id="artwork-edit-btn" class="works-action-btn works-action-btn-secondary" type="button" disabled>수정</button>
          <button id="artwork-remove-btn" class="works-action-btn works-action-btn-danger" type="button" disabled>소장 해제</button>
        </div>
      </div>
      <div id="artwork-resolution-note" class="artwork-resolution-note" hidden><span id="artwork-resolution-text"></span><button id="artwork-resolve-btn" type="button">연결 검토</button></div>
      <div id="collection-table" class="artwork-table active" role="tabpanel"></div>
      <div id="past-exhibition-table" class="artwork-table" role="tabpanel" hidden></div>
    </section>
  </main>

  <dialog id="artwork-editor" class="artwork-dialog">
    <form id="artwork-editor-form" method="dialog">
      <div class="artwork-dialog-header"><h2 id="artwork-editor-title">작품 수정</h2><button id="artwork-editor-cancel" type="button" aria-label="닫기">×</button></div>
      <div class="artwork-form-grid">
        <label>작품명<input name="title" required></label>
        <label>작가<input name="artistName" required></label>
        <label>가격<input name="currentPrice" inputmode="numeric"></label>
        <label>크기<input name="size"></label>
        <label>재료<input name="medium"></label>
        <label>연도<input name="year" inputmode="numeric"></label>
        <label data-collection-field>소장 번호<input name="collectionNumber" placeholder="COL-2026-001"></label>
        <label data-collection-field>등록일<input name="dateAdded" type="date"></label>
        <label class="checkbox-field" data-collection-field><input name="owned" type="checkbox"> 소장품</label>
      </div>
      <p id="artwork-editor-error" class="artwork-editor-error" aria-live="polite"></p>
      <div class="artwork-dialog-actions"><button id="artwork-editor-cancel-bottom" type="button" onclick="document.getElementById('artwork-editor').close()">취소</button><button type="submit">저장</button></div>
    </form>
  </dialog>

  <dialog id="artwork-resolution-dialog" class="artwork-dialog artwork-resolution-dialog">
    <form id="artwork-resolution-form" method="dialog">
      <div class="artwork-dialog-header"><h2>전시 작품 연결</h2><button id="artwork-resolution-cancel" type="button" aria-label="닫기">×</button></div>
      <p>자동 연결하지 않은 항목입니다. 기존 작품을 선택하거나 새 정식 작품으로 등록하세요.</p>
      <div class="artwork-form-grid">
        <label class="wide">연결할 전시 작품<select name="occurrence"></select></label>
        <p id="artwork-resolution-context" class="artwork-resolution-context wide"></p>
        <label class="wide">기존 작품<select name="workId"></select></label>
      </div>
      <div class="artwork-dialog-actions"><button id="artwork-resolution-create" type="button">새 작품으로 등록</button><button type="submit">기존 작품에 연결</button></div>
    </form>
  </dialog>

  <script src="sync/cloud-sync-protocol.js?v=20260907-1"></script>
  <script src="sync/cloud-sync-model.js?v=20260903-1"></script>
  <script src="sync/cloud-sync-reconciliation.js?v=20260903-1"></script>
  <script src="cloud-sync.js?v=20260907-1"></script>
  <script src="auth.js?v=20260819-1"></script>
  <script src="storage/storage-adapter.js?v=20260903-1"></script>
  <script src="storage/exhibitions-repository.js?v=20260903-1"></script>
  <script src="artworks/repository.js?v=20260907-1"></script>
  <script src="artworks/identity.js?v=20260907-1"></script>
  <script src="artworks/exhibition-index.js?v=20260907-1"></script>
  <script src="artworks/sync-service.js?v=20260907-1"></script>
  <script src="artworks/work-picker-controller.js?v=20260907-1"></script>
  <script src="exhibitions/image-lifecycle.js?v=20260907-1"></script>
  <script src="vendor/sheetjs-0.20.3/xlsx.full.min.js"></script>
  <script src="vendor/tabulator-6.5.0/tabulator.min.js"></script>
  <script src="artwork-management/collection-table.js?v=20260907-1"></script>
  <script src="artwork-management/past-exhibition-table.js?v=20260907-1"></script>
  <script src="artwork-management/selection-controller.js?v=20260907-1"></script>
  <script src="artwork-management/filters-controller.js?v=20260907-1"></script>
  <script src="artwork-management/toolbar-controller.js?v=20260907-1"></script>
    <script src="artwork-management/collection-add-controller.js?v=20260907-1"></script>
  <script src="artwork-management/editor-controller.js?v=20260907-1"></script>
  <script src="artwork-management/row-editor-controller.js?v=20260907-1"></script>
  <script src="artwork-management/excel-export.js?v=20260907-1"></script>
  <script src="artwork-management.js?v=20260907-1"></script>
</body>
</html>
