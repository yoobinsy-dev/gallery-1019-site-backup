<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도예공방 10.19 - 개인작업 관리</title>
  <link rel="stylesheet" href="pottery-personal-work.css?v=20260812-4">
</head>
<body>
  <a class="personal-back-link" href="pottery-workshop.html" aria-label="도예공방 메뉴로 돌아가기">← 메뉴로</a>

  <main class="personal-wrap">
    <header class="personal-header">
      <h1>개인작업 관리</h1>
      <p>작가/어드민/강사 계정의 개인작업 이용 현황을 계약 주기 기준으로 관리합니다.</p>
    </header>

    <section class="personal-panel">
      <h2>개인작업 이용자 추가</h2>
      <form id="personal-add-form" class="personal-form" autocomplete="off">
        <div class="personal-field">
          <label for="personal-user-name">성함</label>
          <select id="personal-user-name" required>
            <option value="">선택</option>
          </select>
        </div>
        <div class="personal-field">
          <label for="personal-monthly-fee">월별 이용료</label>
          <input id="personal-monthly-fee" class="money-input" type="text" inputmode="numeric" placeholder="월별 이용료">
        </div>
        <div class="personal-field">
          <label for="personal-payment-date">결제일</label>
          <input id="personal-payment-date" type="date" required>
        </div>
        <div class="personal-field">
          <label for="personal-start-date">이용 시작일</label>
          <input id="personal-start-date" type="date" required>
        </div>
        <div class="personal-field">
          <label for="personal-max-hours">맥스 이용시간</label>
          <input id="personal-max-hours" type="number" min="1" step="0.5" value="100" required>
        </div>
        <button type="submit" class="personal-submit-btn">추가</button>
      </form>
    </section>

    <section class="personal-table-panel">
      <div class="personal-table-wrap">
        <table class="personal-table">
          <thead>
            <tr>
              <th class="select-col-header">선택</th>
              <th class="name-col-header">성함</th>
              <th class="period-col-header">계약 기간</th>
              <th class="fee-col-header">월별 이용료</th>
              <th class="payment-col-header">최근 결제일</th>
              <th class="used-col-header">사용한 이용시간</th>
              <th class="remain-col-header">남은 이용시간</th>
              <th class="edit-only-col">맥스 이용시간 수정</th>
              <th class="action-col-header">작업</th>
            </tr>
          </thead>
          <tbody id="personal-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="personal-table-panel dormant-panel">
      <h2>휴면 계정</h2>
      <div class="personal-table-wrap">
        <table class="personal-table dormant-table">
          <thead>
            <tr>
              <th class="select-col-header">선택</th>
              <th class="name-col-header">성함</th>
              <th class="period-col-header">가장 최근 계약 기간</th>
              <th class="fee-col-header">월별 이용료</th>
              <th class="payment-col-header">최근 결제일</th>
              <th class="used-col-header">사용한 이용시간</th>
              <th class="remain-col-header">남은 이용시간</th>
              <th class="action-col-header">작업</th>
            </tr>
          </thead>
          <tbody id="personal-dormant-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="personal-modal" id="personal-payment-modal" aria-hidden="true">
    <div class="personal-modal-content">
      <h2>결제일 추가</h2>
      <div class="personal-field">
        <label for="personal-payment-modal-date">결제일</label>
        <input id="personal-payment-modal-date" type="date">
      </div>
      <div class="personal-modal-actions">
        <button type="button" class="personal-primary-btn" id="personal-payment-modal-save">추가</button>
        <button type="button" class="personal-secondary-btn" id="personal-payment-modal-close">닫기</button>
      </div>
    </div>
  </div>

  <div class="personal-modal" id="personal-detail-modal" aria-hidden="true">
    <div class="personal-modal-content personal-modal-wide">
      <h2 id="personal-detail-title">상세</h2>
      <div class="personal-detail-grid">
        <section class="personal-detail-card">
          <h3>결제 이력</h3>
          <table class="personal-detail-table">
            <thead>
              <tr>
                <th>결제일</th>
              </tr>
            </thead>
            <tbody id="personal-detail-payment-body"></tbody>
          </table>
        </section>
        <section class="personal-detail-card personal-detail-card-wide">
          <h3>스튜디오 이용 이력 (개인작업)</h3>
          <table class="personal-detail-table">
            <thead>
              <tr>
                <th>일시</th>
                <th>이용시간</th>
              </tr>
            </thead>
            <tbody id="personal-detail-usage-body"></tbody>
          </table>
        </section>
      </div>
      <div class="personal-modal-actions">
        <button type="button" class="personal-secondary-btn" id="personal-detail-close">닫기</button>
      </div>
    </div>
  </div>

  <div class="personal-modal" id="personal-activate-modal" aria-hidden="true">
    <div class="personal-modal-content">
      <h2>휴면 계정 활성화</h2>
      <div class="personal-field">
        <label for="personal-activate-start-date">새 계약 기간 시작일</label>
        <input id="personal-activate-start-date" type="date">
      </div>
      <div class="personal-field">
        <label for="personal-activate-monthly-fee">월별 이용료</label>
        <input id="personal-activate-monthly-fee" class="money-input" type="text" inputmode="numeric" placeholder="월별 이용료">
      </div>
      <div class="personal-field">
        <label for="personal-activate-payment-date">결제일</label>
        <input id="personal-activate-payment-date" type="date">
      </div>
      <div class="personal-field">
        <label for="personal-activate-max-hours">맥스 이용시간</label>
        <input id="personal-activate-max-hours" type="number" min="1" step="0.5">
      </div>
      <div class="personal-modal-actions">
        <button type="button" class="personal-primary-btn" id="personal-activate-save">활성</button>
        <button type="button" class="personal-secondary-btn" id="personal-activate-close">닫기</button>
      </div>
    </div>
  </div>

  <script src="auth.js?v=20260812-2"></script>
  <script src="pottery-landing.js?v=20260812-2"></script>
  <script src="pottery-personal-work.js?v=20260812-4"></script>
</body>
</html>
