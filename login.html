<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>10.19 갤러리&라운지 - 로그인</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-container">
    <div class="auth-box">
      <h1 class="auth-title">10.19 갤러리&라운지</h1>
      
      <!-- Login Form -->
      <div id="login-form" class="auth-form active">
        <h2>로그인</h2>
        <input type="text" id="login-id" placeholder="실명, 사용자명, 전화번호, 또는 이메일" class="auth-input">
        <input type="password" id="login-password" placeholder="비밀번호" class="auth-input">
        <button class="auth-btn" onclick="handleLogin()">로그인</button>
        <p class="auth-toggle">계정이 없으신가요? <span onclick="toggleForm()">회원가입</span></p>
      </div>

      <!-- Signup Form -->
      <div id="signup-form" class="auth-form">
        <h2>회원가입</h2>
        <input type="text" id="signup-name" placeholder="실명" class="auth-input">
        <input type="text" id="signup-username" placeholder="사용자명" class="auth-input">
        <input type="email" id="signup-email" placeholder="이메일" class="auth-input">
        <input type="tel" id="signup-phone" placeholder="전화번호" class="auth-input">
        <input type="password" id="signup-password" placeholder="비밀번호" class="auth-input">
        <input type="password" id="signup-confirm" placeholder="비밀번호 확인" class="auth-input">
        <button class="auth-btn" onclick="handleSignup()">회원가입</button>
        <p class="auth-toggle">이미 계정이 있으신가요? <span onclick="toggleForm()">로그인</span></p>
      </div>

      <div id="auth-message" class="auth-message"></div>
    </div>
  </div>

  <script src="cloud-sync.js?v=20260811-3"></script>
  <script src="auth.js?v=20260807-1"></script>
</body>
</html>
